<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
<defs><clipPath id="clip"><rect width="1200" height="250" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04180c"/><stop offset="1" stop-color="#010a04"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ff66" stop-opacity="0.9"/><stop offset="0.5" stop-color="#0f4d26"/><stop offset="1" stop-color="#00ff66" stop-opacity="0.5"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ff66" stop-opacity="0"/><stop offset="0.5" stop-color="#00ff66" stop-opacity="0.10"/><stop offset="1" stop-color="#00ff66" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00ff66" stroke-opacity="0.06"/></pattern>
<filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gs" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="250" fill="url(#bg)"/><rect width="1200" height="250" fill="url(#grid)"/><text x="44" y="42" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#5fbf80" letter-spacing="4">HOW I WORK</text><rect x="18" y="62" width="220" height="164" rx="14" fill="#00ff66" fill-opacity="0.05" stroke="#00ff66" stroke-opacity="0.45"/><circle cx="54" cy="108" r="22" fill="none" stroke="#00ff66" stroke-width="2"/><path d="M44 108l8 8 14-16" fill="none" stroke="#00ff66" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.6s" begin="0.3s" fill="freeze"/></path><text x="38" y="158" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#00ff66" letter-spacing="1.5">TESTS FIRST</text><text x="38" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">600+ tests in FailureForge,</text><text x="38" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">355 in pasteguard</text><rect x="253" y="62" width="220" height="164" rx="14" fill="#38d6ff" fill-opacity="0.05" stroke="#38d6ff" stroke-opacity="0.45"/><circle cx="289" cy="108" r="22" fill="none" stroke="#38d6ff" stroke-width="2"/><path d="M279 108l8 8 14-16" fill="none" stroke="#38d6ff" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.6s" begin="0.8s" fill="freeze"/></path><text x="273" y="158" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#38d6ff" letter-spacing="1.5">CONTINUOUS INTEGRATION</text><text x="273" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">GitHub Actions on every push</text><rect x="488" y="62" width="220" height="164" rx="14" fill="#ffc857" fill-opacity="0.05" stroke="#ffc857" stroke-opacity="0.45"/><circle cx="524" cy="108" r="22" fill="none" stroke="#ffc857" stroke-width="2"/><path d="M514 108l8 8 14-16" fill="none" stroke="#ffc857" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.6s" begin="1.3s" fill="freeze"/></path><text x="508" y="158" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#ffc857" letter-spacing="1.5">HONEST STATUS NOTES</text><text x="508" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">READMEs say what is verified</text><text x="508" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">and what is not</text><rect x="723" y="62" width="220" height="164" rx="14" fill="#b388ff" fill-opacity="0.05" stroke="#b388ff" stroke-opacity="0.45"/><circle cx="759" cy="108" r="22" fill="none" stroke="#b388ff" stroke-width="2"/><path d="M749 108l8 8 14-16" fill="none" stroke="#b388ff" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.6s" begin="1.8s" fill="freeze"/></path><text x="743" y="158" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#b388ff" letter-spacing="1.5">PRIVACY BY DESIGN</text><text x="743" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">pasteguard has no network</text><text x="743" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">code, and tests enforce it</text><rect x="958" y="62" width="220" height="164" rx="14" fill="#ff4d6d" fill-opacity="0.05" stroke="#ff4d6d" stroke-opacity="0.45"/><circle cx="994" cy="108" r="22" fill="none" stroke="#ff4d6d" stroke-width="2"/><path d="M984 108l8 8 14-16" fill="none" stroke="#ff4d6d" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.6s" begin="2.3s" fill="freeze"/></path><text x="978" y="158" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#ff4d6d" letter-spacing="1.5">REPRODUCIBLE RESULTS</text><text x="978" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">Seeded runs, held-out</text><text x="978" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fd9b3">confirmation, saved reports</text>
<rect x="-300" y="0" width="300" height="250" fill="url(#sweep)"><animate attributeName="x" values="-300;1200" dur="7s" repeatCount="indefinite"/></rect></g>
<rect x="1" y="1" width="1198" height="248" rx="18" fill="none" stroke="url(#bd)" stroke-width="1.5"/></svg>