name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # once a day
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to an exact commit (Platane/snk v3) so the action cannot change under us.
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#00ff66&color_dots=#0b1f12,#0f4d26,#13803a,#00c853,#00ff66

      # Publish the SVG to a separate "output" branch so main stays clean.
      - name: Push to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg
          git commit -q -m "Generate contribution snake"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
